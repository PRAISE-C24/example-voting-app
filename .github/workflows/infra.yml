name: infra

on:
  pull_request:
    paths:
      - "infra/eks/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/eks/**"
      - ".github/workflows/infra.yml"

permissions:
  id-token: write   # lets the job request the OIDC token
  contents: read

concurrency:
  group: terraform-eks
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/eks
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.10"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Show who we are
        run: aws sts get-caller-identity

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=example-voting-app/eks/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -lock-timeout=5m -out=tfplan

      - name: Add plan to the job summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
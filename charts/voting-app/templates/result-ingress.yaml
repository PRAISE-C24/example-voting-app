{{- if .Values.result.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: result
  labels:
    app.kubernetes.io/name: result
    {{- include "voting-app.labels" . | nindent 4 }}
  {{- with .Values.result.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.result.ingress.className }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: result
                port:
                  number: {{ .Values.result.service.port }}
{{- end }}